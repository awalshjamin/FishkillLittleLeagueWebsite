name: Publish website and league schedule
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  teams:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.teams.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: teams
        run: |
          matrix=$(python3 scripts/publish-schedule.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  fetch:
    needs: teams
    if: ${{ needs.teams.outputs.matrix != '{"include": []}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.teams.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'icalendar>=6,<7' 'recurring-ical-events>=3,<4'
      - name: Read team schedule
        env:
          GAMECHANGER_FEED: ${{ secrets[matrix.secret] }}
          TEAM: ${{ matrix.team }}
        run: python scripts/publish-schedule.py --snapshot "$TEAM" events.json
      - uses: actions/upload-artifact@v4
        with:
          name: gamechanger-${{ matrix.index }}
          path: events.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  build:
    needs: [teams, fetch]
    if: ${{ !cancelled() && needs.teams.result == 'success' && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'icalendar>=6,<7' 'recurring-ical-events>=3,<4'
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        if: needs.fetch.result == 'success'
        with:
          pattern: gamechanger-*
          path: _feeds
      - name: Prepare site and refresh schedule
        run: |
          python scripts/update-season.py --check
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -r _site/.github _site/scripts
          python scripts/publish-schedule.py --publish-snapshots _feeds _site/season-info
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
