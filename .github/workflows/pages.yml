name: Publish website and league schedule
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'icalendar>=6,<7' 'recurring-ical-events>=3,<4'
      - uses: actions/configure-pages@v5
      - name: Prepare site and refresh schedule
        env:
          GAMECHANGER_FEEDS: ${{ secrets.GAMECHANGER_FEEDS }}
        run: |
          python scripts/update-season.py --check
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -r _site/.github _site/scripts
          python scripts/publish-schedule.py _site/season-info
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
